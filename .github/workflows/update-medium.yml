name: Update Medium widget data

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-medium:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch the three newest Medium posts
        run: node .github/scripts/update-medium.mjs

      - name: Commit data only when it changed
        shell: bash
        run: |
          if git diff --quiet -- data/medium.json; then
            echo "Medium widget data is unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/medium.json
          git diff --cached --name-only | grep -qx "data/medium.json"
          git commit -m "chore: update Medium widget data"
          git push
